# KVGH GitLab CI/CD（實驗室自架 GitLab）
#
# 統一流程（八階段，各階段單一職責；每個 job log 開頭都會印出驗證目的）：
#   validate → lint → build → unit-test → integration-test → e2e-test → deploy → verify
#
# log 統一格式（比照 kvgh-rehabilitation-system/backend-fastapi 的 job log）：
#   開頭 heredoc banner（==== 框 + 本階段會驗證以下內容 + [失敗代表] + [執行方式]）
#   → 每步驟前 "--- [N/M] 步驟名 ..." → 成功後 "✓ 通過" → 結尾 "=== XXX 全部通過 ==="
#
# 分支模型：
#   main = 整合分支：push / MR 跑 validate→lint→build→三層測試（不部署），
#          同時在本機 runner 預熱 layer cache
#   prod = 部署分支：前面全綠後 deploy-prod 自動部署（本機 = PROD），
#          verify 階段對部署後的真實環境跑煙霧測試
#          促版：git push origin main:prod（fast-forward）
#   uat  = 未來擴充佔位：需另建 uat runner 並設 CI variable UAT_ENABLED=true
#
# 選擇性觸發兩層機制：
#   1) build/test 層：rules:changes —— 沒改到的部分連 job 都不會出現
#   2) deploy 層：scripts/deploy_prod.sh 用 git diff 已部署SHA..目標SHA 決定
#      要 build 哪些服務（部署間可能跨多個 commit，不能只看本次 push）
#
# Runner 需求（見 README「CI/CD」）：本機 shell executor、tag `kvgh_prod`、
# 執行 job 的使用者需在 docker group（本機 service 以 ciot 執行）、
# 建議勾 protected branches only。

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "prod"'
    - if: '$CI_COMMIT_BRANCH == "uat"'

stages:
  - validate         # 設定/組態快篩：compose 檔可解析、腳本語法正確（秒級、不起容器）
  - lint             # 程式碼靜態品質：oxlint / ruff（不啟動系統）
  - build            # docker build 即建置驗證（前端含 tsc；同時預熱 layer cache）
  - unit-test        # 單一 image 內部契約：不起 stack、不佔共用資源
  - integration-test # 起隔離 CI stack（kvgh-ci）：驗 API↔DB 真實互動
  - e2e-test         # Playwright 全棧：模擬使用者從前端走到後端與資料庫
  - deploy           # 前面全綠才部署（僅 prod/uat 分支）
  - verify           # 部署後驗證：對真實環境跑煙霧測試（HTTP/登入/workers）

# ---- validate stage：pre-flight 快篩，擋掉「設定改壞讓後面全掛」 ----
preflight-validate:
  stage: validate
  tags: [kvgh_prod]
  interruptible: true
  timeout: 10m
  script:
    - |
      cat <<'EOF'
      =========================================
      Preflight：驗證 compose 組態與腳本語法
      =========================================
      本階段會驗證以下內容：
      [1/2] compose 設定檔可正確解析 (docker-compose.yml / ci/compose.ci.yml)
      驗證摘要：
      - dev/prod 主 compose 檔與 CI 隔離 stack override 都能 config -q 通過
      [2/2] 部署/驗證腳本語法正確 (scripts/*.sh)
      驗證摘要：
      - bash -n 快篩，不起容器、不 build，秒級完成
      [失敗代表]
      設定檔或腳本本身改壞了，後面所有階段都不必跑
      [執行方式]
      [1/3] docker compose config（主 compose 檔）
      [2/3] docker compose config（CI override）
      [3/3] bash -n scripts/*.sh
      =========================================
      EOF
    - echo "--- [1/3] docker compose config（主 compose 檔）..."
    - docker compose -f docker-compose.yml config -q
    - echo "✓ 通過"
    - echo "--- [2/3] docker compose config（CI override）..."
    - docker compose -p kvgh-ci -f docker-compose.yml -f ci/compose.ci.yml config -q
    - echo "✓ 通過"
    - echo "--- [3/3] bash -n scripts/*.sh ..."
    - bash -n scripts/*.sh
    - echo "✓ 通過"
    - echo "=== Preflight 全部通過 ==="

# ---- lint stage：不碰 docker build，純靜態快篩 ----
frontend-lint:
  stage: lint
  tags: [kvgh_prod]
  interruptible: true
  timeout: 15m
  rules:
    - changes:
        - frontend/**/*
  script:
    - |
      cat <<'EOF'
      =========================================
      Oxlint：驗證前端靜態品質
      =========================================
      本階段會驗證以下內容：
      [1/1] frontend TS/JS 靜態掃描 (oxlint)
      驗證摘要：
      - 團隊規範與明顯錯誤（未使用變數、可疑語法等）
      - 不啟動系統、不驗型別（tsc 在 build 階段）
      [失敗代表]
      程式碼有 lint 錯誤，見下方 oxlint 輸出逐條修正
      [執行方式]
      [1/1] 以 node 容器執行 npx oxlint（版本 pin 與 frontend/package.json 對齊）
      =========================================
      EOF
    - echo "--- [1/1] npx oxlint 靜態掃描 ..."
    # oxlint 是獨立二進位，npx 只抓一包免 npm ci；版本 pin 與 frontend/package.json 對齊。
    # --user + HOME=/tmp：避免容器以 root 在 workspace 留檔（shell executor 的 git clean 會炸）
    # UPDATE_NOTIFIER=false：HOME=/tmp 每次都是冷 cache，npx 會印 npm 升版 notice 弄髒 log
    - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
        -e NPM_CONFIG_UPDATE_NOTIFIER=false
        -v "$PWD/frontend:/app" -w /app node:24-alpine
        npx --yes oxlint@1.71.0
    - echo "✓ 通過"
    - echo "=== Oxlint 全部通過 ==="

python-lint:
  stage: lint
  tags: [kvgh_prod]
  interruptible: true
  timeout: 15m
  variables:
    # ruff 版本 pin 這裡（ruff.toml 頂部註解需同步）；--no-cache 免 workspace 留 cache 目錄
    RUFF_IMAGE: ghcr.io/astral-sh/ruff:0.15.22
  rules:
    - changes:
        - backend/**/*
        - worker/**/*
        - ruff.toml
  script:
    - |
      cat <<'EOF'
      =========================================
      Ruff：驗證 Python 靜態品質
      =========================================
      本階段會驗證以下內容：
      [1/2] lint 規則掃描 (ruff check)
      驗證摘要：
      - backend 與 worker 的 lint 規則；不啟動系統
      [2/2] 排版一致性 (ruff format --check)
      驗證摘要：
      - 只檢查不改檔，確認程式碼已跑過 ruff format
      [失敗代表]
      有 lint 錯誤或未跑 ruff format，見下方輸出
      [執行方式]
      [1/2] ruff check backend worker
      [2/2] ruff format --check backend worker
      =========================================
      EOF
    - echo "--- [1/2] ruff check（lint 規則）..."
    - docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/io" -w /io "$RUFF_IMAGE" check backend worker --no-cache
    - echo "✓ 通過"
    - echo "--- [2/2] ruff format --check（排版一致性，只檢查不改檔）..."
    - docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/io" -w /io "$RUFF_IMAGE" format --check backend worker --no-cache
    - echo "✓ 通過"
    - echo "=== Ruff 全部通過 ==="

# ---- build stage：docker build 即建置驗證，同時預熱本機 runner 的 layer cache ----
.build-base:
  stage: build
  tags: [kvgh_prod]
  variables:
    # 迴避 compose bake 完成後偶發 hang 不退出的已知問題（worker/CLAUDE.md）
    COMPOSE_BAKE: "false"
    # docker driver 的 default builder：無 tarball 搬運（docker-container driver
    # 每次 build 都要把 11GB worker image 打包傳回 daemon，cache hit 也逃不掉）
    BUILDX_BUILDER: "default"
  timeout: 1h
  # 同分支又有新 push 時自動取消過時的驗證（部署 job 不可中斷，不繼承此設定）
  interruptible: true

frontend-build:
  extends: .build-base
  script:
    - |
      cat <<'EOF'
      =========================================
      Build：驗證 frontend image 可完整建置
      =========================================
      本階段會驗證以下內容：
      [1/1] frontend image 完整建置 (frontend/Dockerfile)
      驗證摘要：
      - npm ci 依賴解析、tsc -b 型別檢查、vite build 打包全在 Dockerfile 內執行
      [失敗代表]
      依賴、型別或打包壞了，見下方 build log 定位是哪一步
      [執行方式]
      [1/1] docker compose build frontend
      =========================================
      EOF
    - echo "--- [1/1] docker compose build frontend ..."
    - docker compose build frontend # npm ci 之後，tsc -b + vite build 都在這步
    - echo "✓ 通過"
    - echo "=== Build（frontend）全部通過 ==="
  rules:
    - changes:
        - frontend/**/*

backend-build:
  extends: .build-base
  script:
    - |
      cat <<'EOF'
      =========================================
      Build：驗證 backend image 可完整建置
      =========================================
      本階段會驗證以下內容：
      [1/1] backend image 完整建置 (backend/Dockerfile)
      驗證摘要：
      - pip 依賴解析與程式碼打包
      [失敗代表]
      requirements 或 Dockerfile 壞了，見下方 build log
      [執行方式]
      [1/1] docker compose build backend
      =========================================
      EOF
    - echo "--- [1/1] docker compose build backend ..."
    - docker compose build backend
    - echo "✓ 通過"
    - echo "=== Build（backend）全部通過 ==="
  rules:
    - changes:
        - backend/**/*

worker-build:
  extends: .build-base
  script:
    - |
      cat <<'EOF'
      =========================================
      Build：驗證 worker image 可完整建置
      =========================================
      本階段會驗證以下內容：
      [1/1] worker image（gpu/cpu 共用）完整建置 (worker/Dockerfile)
      驗證摘要：
      - 演算法依賴安裝與 backend/app 共用 models 的 COPY 皆成功
      [失敗代表]
      worker 依賴或 Dockerfile 壞了，見下方 build log
      [執行方式]
      [1/1] docker compose build worker-gpu（gpu/cpu 共用 image，只建一次）
      =========================================
      EOF
    - echo "--- [1/1] docker compose build worker-gpu ..."
    - docker compose build worker-gpu # gpu/cpu 共用 kvgh-worker image，只建一次
    - echo "✓ 通過"
    - echo "=== Build（worker）全部通過 ==="
  rules:
    - changes:
        - worker/**/*
        - backend/app/**/* # worker/Dockerfile 有 COPY backend/app（共用 models）
        - algorithm/requirements.txt
        - .dockerignore

# ---- unit-test stage：單一 image 內部契約，不起 stack ----
worker-contract-test:
  stage: unit-test
  tags: [kvgh_prod]
  interruptible: true
  timeout: 30m
  variables:
    COMPOSE_BAKE: "false"
    BUILDX_BUILDER: "default"
  rules:
    - changes:
        - worker/**/*
        - backend/app/**/* # task_queue 契約兩端
        - algorithm/requirements.txt
        - ci/**/*
  script:
    - |
      cat <<'EOF'
      =========================================
      Worker 契約：驗證任務名稱兩端一致
      =========================================
      本階段會驗證以下內容：
      [1/2] worker 模組可載入 (import worker.tasks)
      驗證摘要：
      - 在 kvgh-worker image 內驗 Celery 設定與全 pipeline 模組可 import
      [2/2] 任務名稱契約 (backend task_queue ↔ worker tasks)
      驗證摘要：
      - backend 發送的任務名稱都有註冊——兩端只以字串耦合，build 期抓不到
      [失敗代表]
      worker 模組壞了或任務名兩端不一致（改名沒同步）
      [執行方式]
      [1/2] docker compose build worker-gpu（build 階段已建過 → 全 cache hit 秒過）
      [2/2] 在容器內執行契約測試（不起 stack、不碰 GPU/權重/broker）
      =========================================
      EOF
    - echo "--- [1/2] 確認 worker image 為當前程式碼 ..."
    - docker compose build worker-gpu
    - echo "✓ 通過"
    - echo "--- [2/2] 在容器內執行契約測試 ..."
    # 掛 ./algorithm：annotate.py 在 import 期載入 make_vid_json_api（bind mount 慣例同正式 stack）
    - docker run --rm
        -v "$PWD/algorithm:/algorithm"
        -v "$PWD/worker/tests:/app/worker/tests:ro"
        -e PYTHONDONTWRITEBYTECODE=1
        kvgh-worker python /app/worker/tests/check_task_contract.py
    - echo "✓ 通過"
    - echo "=== Worker 契約 全部通過 ==="

# ---- integration-test / e2e-test stage：起隔離 CI stack 跑大功能契約測試 ----
# 測試策略：只驗穩定契約（登入、頁面存活、HTTP 狀態碼），不驗實作細節——
# 開發中改功能不需要跟著改測試；測試紅燈 = 大功能真的壞了。
.ci-stack-base:
  stage: integration-test
  tags: [kvgh_prod]
  interruptible: true
  timeout: 30m
  # 同機永遠只有一份 kvgh-ci stack（固定名 + 跨 pipeline 互斥）；
  # 固定 project 名讓上次被 kill 留下的殘骸在 before_script 的 down 自動清掉
  resource_group: ci-test-stack
  variables:
    COMPOSE_BAKE: "false"
    BUILDX_BUILDER: "default"
    CI_COMPOSE: docker compose -p kvgh-ci -f docker-compose.yml -f ci/compose.ci.yml
  before_script:
    - echo "--- [前置] 清掉可能殘留的 kvgh-ci stack（含 volume），保證測試環境全新 ..."
    - $CI_COMPOSE down -v --remove-orphans || true
  after_script: # script 失敗/超時仍會執行 → 保證測試 stack 不殘留
    - echo "--- [收尾] 拆除 kvgh-ci stack（含 volume）..."
    - docker compose -p kvgh-ci -f docker-compose.yml -f ci/compose.ci.yml down -v --remove-orphans || true

backend-api-tests:
  extends: .ci-stack-base
  rules:
    - changes:
        - backend/**/*
        - ci/**/*
        - docker-compose.yml
  script:
    - |
      cat <<'EOF'
      =========================================
      Pytest：驗證後端 API 契約
      =========================================
      本階段會驗證以下內容：
      [1/2] API↔DB 真實串接 (backend/tests/api)
      驗證摘要：
      - 起隔離 CI stack（postgres+rabbitmq+backend），以 demo seed 資料對 /api/* 跑 pytest
      [2/2] 穩定契約而非實作細節
      驗證摘要：
      - 只驗登入/權限/狀態碼等大功能契約，開發改實作不會弄斷測試
      [失敗代表]
      後端大功能真的壞了（測試只驗穩定契約，不驗實作細節）
      [執行方式]
      [1/5] build backend image（build 階段已建過 → 全 cache hit）
      [2/5] 啟動 postgres + rabbitmq 並等待 healthy
      [3/5] 以一次性容器建 demo seed 資料（須在 backend 啟動前）
      [4/5] 啟動 backend 並等待 healthy
      [5/5] 執行 pytest API 契約測試（backend/tests/api）
      =========================================
      EOF
    # demo seed 必須在 backend 啟動前跑：entrypoint 的帳號 seed 一跑，
    # 防重複機制（有任何帳號就整批跳過）會讓之後的 --demo 變 no-op。
    # CI 的 DB 每次都是全新的（down -v 保證），順序：先一次性容器建 demo 資料
    # → 再起 backend（entrypoint seed 自動跳過）→ 列表端點就有真資料可驗序列化
    - echo "--- [1/5] build backend image ..."
    - $CI_COMPOSE build backend
    - echo "✓ 通過"
    - echo "--- [2/5] 啟動 postgres + rabbitmq 並等待 healthy ..."
    - $CI_COMPOSE up -d --wait postgres rabbitmq
    - echo "✓ 通過"
    - echo "--- [3/5] 以一次性容器建 demo seed 資料 ..."
    - $CI_COMPOSE run --rm --entrypoint "python -m app.seed --demo" backend
    - echo "✓ 通過"
    - echo "--- [4/5] 啟動 backend 並等待 healthy ..."
    - $CI_COMPOSE up -d --wait backend
    - echo "✓ 通過"
    - echo "--- [5/5] 執行 pytest API 契約測試 ..."
    - $CI_COMPOSE run --rm --build api-tests
    - echo "✓ 通過"
    - echo "=== Pytest 全部通過 ==="

e2e-login-smoke:
  extends: .ci-stack-base
  stage: e2e-test
  rules:
    # Playwright 是全棧測試：backend 改壞登入/dashboard API 一樣要抓，
    # 所以 backend 改動也觸發（frontend 未變時 --build 全 cache hit，秒過）
    - changes:
        - frontend/**/*
        - backend/**/*
        - ci/**/*
        - docker-compose.yml
  script:
    - |
      cat <<'EOF'
      =========================================
      Playwright：驗證使用者關鍵流程
      =========================================
      本階段會驗證以下內容：
      [1/1] 全棧 e2e——登入等關鍵流程 (frontend/e2e)
      驗證摘要：
      - Playwright 從瀏覽器操作前端，經 backend 到資料庫走完整條路——模擬真實使用者
      [失敗代表]
      使用者實際操作會壞（報告見 artifacts 的 playwright-report）
      [執行方式]
      [1/2] 啟動 CI stack 四服務並等待 healthy（不起 worker/weights-init，不碰 GPU 與權重）
      [2/2] 以 Playwright 容器執行 e2e 測試（打 http://frontend）
      =========================================
      EOF
    - echo "--- [1/2] 啟動 CI stack 四服務並等待 healthy ..."
    - $CI_COMPOSE up -d --build --wait postgres rabbitmq backend frontend
    - echo "✓ 通過"
    # backend entrypoint 已自動 seed 帳號（登入煙霧夠用，不需 --demo）
    # Playwright image tag 必須與 frontend/e2e/package.json 的 @playwright/test 同號
    - echo "--- [2/2] 以 Playwright 容器執行 e2e 測試 ..."
    - docker run --rm --network kvgh-ci_default
        --user "$(id -u):$(id -g)" -e HOME=/tmp
        -e NPM_CONFIG_UPDATE_NOTIFIER=false
        -e PW_BASE_URL=http://frontend
        -v "$PWD/frontend/e2e:/e2e" -w /e2e
        mcr.microsoft.com/playwright:v1.61.1-noble
        sh -c "npm ci && npx playwright test"
    - echo "✓ 通過"
    - echo "=== Playwright 全部通過 ==="
  artifacts:
    when: always
    paths:
      - frontend/e2e/playwright-report
      - frontend/e2e/test-results
    expire_in: 1 week

# ---- deploy stage：前面全綠才會進到此階段（= 通過 CI 才部署） ----
deploy-prod:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  tags: [kvgh_prod]
  resource_group: prod-deploy # 部署互斥：同時多次促版會排隊，不並行
  environment:
    name: production # GitLab Operate→Environments 有部署歷史；對舊部署 re-deploy 即回滾
    url: http://localhost:2222
  timeout: 1h
  interruptible: false
  script:
    - |
      cat <<'EOF'
      =========================================
      Deploy：部署到 PROD 環境
      =========================================
      本階段會執行以下內容：
      [1/1] 把 PROD checkout 更新到本次 commit 並套用 (scripts/deploy_prod.sh)
      執行摘要：
      - git diff 已部署SHA..目標SHA 決定選擇性 rebuild，docker compose up 套用
      - 部署後驗證交由下一階段 verify
      [失敗代表]
      部署中斷，環境可能停在中間狀態——看下方 log 判斷卡在哪步
      [執行方式]
      [1/1] bash scripts/deploy_prod.sh（詳細步驟由腳本自印）
      =========================================
      EOF
    # DEPLOY_DIR 預設 /data/kvgh-rehabilitation-system、TARGET_SHA 自動取 $CI_COMMIT_SHA
    - bash scripts/deploy_prod.sh

# ---- 未來擴充佔位：UAT 環境就緒前（無 uat runner、未設 UAT_ENABLED）永不執行 ----
deploy-uat:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "uat" && $UAT_ENABLED == "true"'
  tags: [kvgh_uat]
  resource_group: uat-deploy
  environment:
    name: uat
  timeout: 1h
  script:
    - |
      cat <<'EOF'
      =========================================
      Deploy：部署到 UAT 環境
      =========================================
      本階段會執行以下內容：
      [1/1] 同 deploy-prod，但套用到 UAT checkout (scripts/deploy_prod.sh)
      執行摘要：
      - DEPLOY_DIR 指向 UAT checkout，其餘流程與 PROD 相同
      [失敗代表]
      部署中斷，UAT 環境可能停在中間狀態——看下方 log 判斷卡在哪步
      [執行方式]
      [1/1] DEPLOY_DIR=$UAT_DEPLOY_DIR bash scripts/deploy_prod.sh
      =========================================
      EOF
    - DEPLOY_DIR="${UAT_DEPLOY_DIR:-/data/kvgh-uat}" bash scripts/deploy_prod.sh

# ---- verify stage：對部署後的真實環境跑煙霧測試 ----
# banner 與逐步輸出由 scripts/verify_deploy.sh 自印（CI 與手動執行共用同一份）
verify-prod:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  tags: [kvgh_prod]
  resource_group: prod-deploy # 與部署共用互斥：驗證中不會被下一次部署插隊
  environment:
    name: production
    action: verify # 只驗證、不產生新的 deployment 紀錄
  timeout: 15m
  interruptible: false
  script:
    - bash scripts/verify_deploy.sh

verify-uat:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "uat" && $UAT_ENABLED == "true"'
  tags: [kvgh_uat]
  resource_group: uat-deploy
  environment:
    name: uat
    action: verify
  timeout: 15m
  script:
    - DEPLOY_DIR="${UAT_DEPLOY_DIR:-/data/kvgh-uat}" bash scripts/verify_deploy.sh
