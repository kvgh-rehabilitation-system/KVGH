# KVGH 高榮智慧復健系統 — 服務拓撲
#
#   frontend(nginx:2000) → backend(uvicorn:8000) → postgres / rabbitmq
#   worker-gpu / worker-cpu ← rabbitmq（Celery 佇列：gpu / cpu）
#   weights-init（一次性）：下載 ~1.5GB 模型權重，workers 等它成功才啟動
#
# 共用資料面：./media bind mount 進 backend 與兩個 worker 的 /data/media，
# 影片與演算法產物都放這裡（backend 寫入、worker 讀寫，DB 只存相對路徑）。
# 所有密碼/連接埠皆可由 .env 覆寫，預設值僅供開發。
name: kvgh
services:
  # 主資料庫：帳號、病歷、計畫、上傳與分析結果的唯一事實來源
  postgres:
    image: postgres:16
    container_name: kvgh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kvgh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-pg}
      POSTGRES_DB: ${POSTGRES_DB:-kvgh}
    ports:
      # 主機端用 15432：避開宿主機可能已有的原生 PostgreSQL(5432)
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # DB 資料放 named volume（不隨容器重建消失；docker volume rm 才會清掉）
      - kvgh-pgdata:/var/lib/postgresql/data
    # healthcheck 供 backend/workers 的 depends_on 等待 DB 就緒
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kvgh} -d ${POSTGRES_DB:-kvgh}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Celery broker：backend 發任務、workers 收任務的訊息佇列
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: kvgh-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kvgh}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-change-me-mq}
    ports:
      # 5672 發布到主機：未來 VRAM 更大的遠端 GPU server 上的 worker 也連同一個 broker
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      # 管理介面僅限本機
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # FastAPI 後端：程式碼打進 image（無 bind mount），小改用 docker cp 熱修
  backend:
    build: ./backend
    # 固定 image 名（同 compose v2 預設），CI 部署腳本靠此名稱打 SHA tag
    image: kvgh-backend
    container_name: kvgh-backend
    ports:
      # 發布到主機：遠端開發（如 Mac 上的 vite dev）直連此後端
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # 以服務名（postgres/rabbitmq）連線——compose 內建 DNS 解析
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kvgh}:${POSTGRES_PASSWORD:-change-me-pg}@postgres:5432/${POSTGRES_DB:-kvgh}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-kvgh}:${RABBITMQ_PASS:-change-me-mq}@rabbitmq:5672//
      MEDIA_ROOT: /data/media
    volumes:
      # 影片與演算法產物永久存放於 media/（除非使用者刪除）。
      # MEDIA_DIR 可由 .env 覆寫成絕對路徑——部署 checkout（如 /data/kvgh-prod）
      # 跑 compose 時指回既有的 /data/KVGH/media，資料不搬家
      - ${MEDIA_DIR:-./media}:/data/media
    # 等 DB 與 broker 都通過 healthcheck 才啟動（entrypoint 內另有等待重試當雙保險）
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # nginx 靜態站 + /api 反代到 backend（前端唯一對外入口）
  frontend:
    build: ./frontend
    image: kvgh-frontend
    container_name: kvgh-frontend
    ports:
      # port 2000 為使用者指定的對外入口，勿改（見根目錄 CLAUDE.md）
      - "${FRONTEND_PORT:-2000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 一次性：檢查/下載模型權重（~1.5GB，來自本 repo 的 GitHub Release weights-v1）。
  # 冪等——權重齊全時秒過；缺權重時 workers 會等它成功完成才啟動。
  weights-init:
    image: curlimages/curl:8.11.1
    container_name: kvgh-weights-init
    user: "0"
    entrypoint: ["/bin/sh", "/scripts/download_weights.sh"]
    environment:
      ENGINE_ROOT: /engine/2D_and_3D_project
      MANIFEST: /scripts/weights_manifest.txt
    volumes:
      - ${ENGINE_DIR:-./algorithm/2D_and_3D_project}:/engine/2D_and_3D_project
      - ./scripts:/scripts:ro
    restart: "no"

  worker-gpu:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # gpu/cpu 兩個 worker 共用同一顆 image（同 Dockerfile 同 context），只在這裡 build 一次；
    # worker-cpu 不設 build，直接引用此 image。首次改用共用名前先跑
    # `docker compose build worker-gpu`（或 `docker tag kvgh-worker-gpu kvgh-worker`）
    image: kvgh-worker
    container_name: kvgh-worker-gpu
    # autoscale=<上限>,1：無任務時常駐 1 個 process，佇列有任務自動擴增；
    # 上限由 GPU VRAM 決定（2080 = 2），防止超收導致 OOM
    command: >
      celery -A worker.celery_app worker
      -Q gpu -n gpu@%h
      --autoscale=${GPU_MAX_CONCURRENCY:-2},1
      --loglevel=INFO
    environment: &worker-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kvgh}:${POSTGRES_PASSWORD:-change-me-pg}@postgres:5432/${POSTGRES_DB:-kvgh}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-kvgh}:${RABBITMQ_PASS:-change-me-mq}@rabbitmq:5672//
      MEDIA_ROOT: /data/media
      ALGORITHM_DIR: /algorithm
      ENGINE_DIR: /engine/2D_and_3D_project
      GPU_MIN_FREE_VRAM_MB: ${GPU_MIN_FREE_VRAM_MB:-3000}
      COMPARISON_TIMEOUT_SECONDS: ${COMPARISON_TIMEOUT_SECONDS:-1800}
    volumes:
      - ${MEDIA_DIR:-./media}:/data/media
      # git 追蹤的演算法腳本（get_2D_3D_script / humanpose_api / make_vid_json_api）
      - ./algorithm:/algorithm
      # 演算法引擎工作目錄（程式碼 git 追蹤、權重與已編譯 .so 為 gitignore；不打進 image）
      - ${ENGINE_DIR:-./algorithm/2D_and_3D_project}:/engine/2D_and_3D_project
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      weights-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-cpu:
    # 共用 worker-gpu build 出的 kvgh-worker image（見上方註解），自己不 build
    image: kvgh-worker
    container_name: kvgh-worker-cpu
    # 轉檔 / humanpose 比對（CPU-bound）/ 標註存檔，不佔 GPU 名額
    command: >
      celery -A worker.celery_app worker
      -Q cpu -n cpu@%h
      --autoscale=4,1
      --loglevel=INFO
    environment: *worker-env
    volumes:
      - ${MEDIA_DIR:-./media}:/data/media
      - ./algorithm:/algorithm
      - ${ENGINE_DIR:-./algorithm/2D_and_3D_project}:/engine/2D_and_3D_project
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      weights-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kvgh-pgdata:
